<script>/* الغامق (html.dk) قبل ما الصفحة تترسم، علشان مايبقاش فيه ومضة فاتحة. الثيم بيحدد: زي موبايل العميل / فاتح / غامق (theme.js) */
(function () { try { var d = document.documentElement, q = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null, s = new URLSearchParams(location.search).get('s') || location.hostname, t = null;
  try { t = JSON.parse(localStorage.getItem('rds_' + s + '_thm') || 'null'); } catch (e) {}
  var m = (t && t.m) || 'auto', on = function () { var md = (window.RdTheme && RdTheme.mode()) || m; d.classList.toggle('dk', md === 'dark' || (md === 'auto' && !!(q && q.matches))); };
  on(); if (q) { if (q.addEventListener) q.addEventListener('change', on); else if (q.addListener) q.addListener(on); } window.__dkOn = on; } catch (e) {} })();</script>
